# CheckLizz - levanta TODO el backend con un solo comando:
#   docker compose up -d --build
# Servicios: PostgreSQL + Keycloak + API (Node.js)
# Las variables vienen de .env (copiar de .env.example); todas tienen valor por defecto.

name: checklizz

services:
  postgres:
    image: postgres:16-alpine
    container_name: checklizz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checklizz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checklizz_dev}
      POSTGRES_DB: ${POSTGRES_DB:-checklizz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts se ejecutan solo la primera vez que se crea el volumen
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checklizz} -d ${POSTGRES_DB:-checklizz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: checklizz-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./infra/keycloak/realm-checklizz.json:/opt/keycloak/data/import/realm-checklizz.json:ro

  api:
    build: ./api
    container_name: checklizz-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-checklizz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-checklizz_dev}
      DB_NAME: ${POSTGRES_DB:-checklizz}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: checklizz
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Emisores aceptados en el token (PC, emulador Android, etc.)
      ALLOWED_ISSUERS: ${ALLOWED_ISSUERS:-http://localhost:8080/realms/checklizz,http://10.0.2.2:8080/realms/checklizz}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
  keycloakdata:
